<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffa726"><title>FARIS AI STUDIO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0612;color:#fff;font-family:Tahoma,Arial,sans-serif}
header{background:#ffa726;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;color:#2a1a05}
header b{font-size:15px}header button{background:none;border:0;font-size:24px;cursor:pointer}
nav{display:flex;gap:8px;padding:12px 16px}nav button{flex:1;padding:11px;border-radius:12px;border:1px solid #4b3a61;background:#1b1329;color:#cfc4da;font:inherit;font-size:13px}
nav button.on{background:#352645;color:#f4c14e;border-color:#f4c14e}
.page{display:none;padding:0 16px 40px}.page.on{display:block}
.card{background:#1d1033;border:1px solid #4a3a2c;border-radius:18px;padding:18px;margin-bottom:16px}
h2{font-size:16px;color:#f4c14e;margin:0 0 14px}label{display:block;font-size:13px;margin:14px 0 7px;color:#d8cce6}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #5a4630;background:#120a1d;color:#fff;font:inherit;font-size:14px}
.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:linear-gradient(120deg,#ffd75e,#f5b52c);color:#2a1a05;font:inherit;font-weight:bold;font-size:15px}
.btn2{padding:11px 16px;border-radius:12px;border:1px solid #5a4630;background:#120a1d;color:#f4c14e;font:inherit;font-size:13px}
.btn:disabled{opacity:.5}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px}
.badge{padding:5px 14px;border-radius:20px;font-size:12px;border:1px solid #3a7a55;background:#1b3a2e;color:#8dd5a3}.badge.bad{border-color:#8a3a4a;background:#3a1626;color:#f2a0b0}
.msg{margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.9;display:none}.msg.err{display:block;background:#4a1235;border:1px solid #a04060;color:#f2b3c0}.msg.ok{display:block;background:#12342a;border:1px solid #3a7a55;color:#b6ecc8}
.file{margin-top:8px;padding:12px;border:1px dashed #8c7045;border-radius:12px;font-size:12px;color:#f4dda0;background:#2a1d2e}
.proj{border-top:1px solid #4a3a2c;padding:13px 0}.proj b{font-size:14px}.proj small{color:#b8aec8;display:block;margin:4px 0 8px}
.scene{background:#120a1d;border-radius:10px;padding:10px;margin:8px 0;font-size:12px;line-height:1.9}.scene i{color:#f4c14e;font-style:normal}
</style></head><body>
<header><button id="menu">☰</button><b>FARIS AI STUDIO</b><button id="share">⤴</button></header>
<nav><button class="on" data-p="create">إنشاء سيناريو</button><button data-p="settings">الإعدادات والمشاريع</button></nav>

<section class="page on" id="create"><div class="card"><h2>تحليل درس وإعداد السيناريو</h2>
<label>الصف</label><input id="grade" placeholder="مثال: الصف الثالث الثانوي">
<label>ملف الكتاب (PDF)</label><input type="file" id="pdf" accept="application/pdf,.pdf"><div class="file" id="fileInfo">لم يتم اختيار ملف.</div>
<label>الوحدة</label><input id="unit"><label>الدرس</label><input id="lesson">
<label>مدة الفيديو</label><select id="duration"><option value="short">قصيرة (دقيقة واحدة)</option><option value="medium">متوسطة (3 دقائق)</option><option value="long">طويلة (5 دقائق)</option></select>
<label>صوت التعليق</label><select id="voice"><option>الأستاذ فارس</option><option>معلّقة نسائية</option><option>راوٍ وثائقي</option></select>
<label>أسلوب الفيديو</label><select id="style"><option value="cartoon">كرتوني تعليمي</option><option value="documentary">وثائقي سينمائي</option><option value="story">قصة تعليمية</option><option value="investigation">تحقيق وتشويق</option><option value="visual">شرح بصري</option><option value="classroom">حصة صفية</option></select>
<label>نسبة الشاشة</label><select id="aspect"><option value="9:16">عمودي (موبايل / تيك توك)</option><option value="16:9">أفقي (يوتيوب)</option></select>
<label>لغة التعليق</label><select id="language"><option value="fusha">عربية فصحى مبسطة</option><option value="sudani">لهجة سودانية</option><option value="english">English</option></select>
<label>سرعة التعليق</label><select id="speed"><option value="slow">بطيئة</option><option value="normal" selected>عادية</option><option value="fast">سريعة</option></select>
<label>الموسيقى</label><select id="music"><option value="calm">هادئة</option><option value="epic">ملحمية تاريخية</option><option value="playful">مرحة للأطفال</option><option value="none">بدون موسيقى</option></select>
<label>الشخصيات</label><input id="characters" placeholder="مثال: الأستاذ فارس، رودينا، مكة">
<label>صورة الأستاذ فارس (معاينة)</label><input type="file" id="portrait" accept="image/*"><img id="pv" style="display:none;width:90px;height:90px;object-fit:cover;border-radius:14px;margin-top:10px">
<button class="btn" id="analyze">تحليل الدرس وإعداد السيناريو</button><div class="msg" id="aMsg"></div></div>
<div id="result"></div></section>

<section class="page" id="settings">
<div class="card"><h2>الاتصال</h2><label>رابط الخادم</label><input id="base" dir="ltr" value="https://faris-ai-stud.onrender.com">
<label>رمز الوصول</label><input id="token" type="password" autocomplete="off" dir="ltr">
<button class="btn" id="save">حفظ وفحص الاتصال</button><div class="msg" id="sMsg"></div></div>
<div class="card"><h2>حالة الاتصال السحابي</h2>
<div class="row"><span>الخادم</span><span class="badge bad" id="bSrv">—</span></div>
<div class="row"><span>قاعدة Neon</span><span class="badge bad" id="bDb">—</span></div>
<div class="row"><span>محرك Gemini</span><span class="badge bad" id="bAi">—</span></div></div>
<div class="card"><h2>المشاريع المحفوظة</h2><button class="btn2" id="sync">مزامنة من الخادم</button><div class="msg" id="pMsg"></div><div id="projects"></div></div>
</section>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
$("base").value=store.get("fbase")||$("base").value;$("token").value=store.get("ftoken");
const baseUrl=()=>$("base").value.trim().replace(/\/$/,"");
function show(id,type,t){const e=$(id);e.className="msg "+type;e.textContent=t;}
function tab(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===p));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.p));
$("menu").onclick=()=>tab($("settings").classList.contains("on")?"create":"settings");
$("share").onclick=()=>{if(navigator.share)navigator.share({title:"FARIS AI STUDIO",url:location.href}).catch(()=>{})};
async function api(path,o={}){
  let r;try{r=await fetch(baseUrl()+path,{...o,headers:{Authorization:"Bearer "+$("token").value.trim(),...(o.body?{"Content-Type":"application/json"}:{})}});}
  catch{throw Error("تعذر الوصول إلى الخادم. تحقق من الرابط والإنترنت (قد يستغرق الخادم دقيقة ليستيقظ).");}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(d.message||d.error||("خطأ "+r.status));return d;
}
function badge(id,ok,t){const e=$(id);e.textContent=t;e.className="badge"+(ok?"":" bad");}
async function health(){
  try{const r=await fetch(baseUrl()+"/health");const d=await r.json();
    badge("bSrv",true,"يعمل");badge("bDb",d.database==="connected",d.database==="connected"?"متصل":"غير متصل");badge("bAi",!!d.geminiConfigured,d.geminiConfigured?"مفعّل":"غير مفعّل");return true;}
  catch{badge("bSrv",false,"لا يستجيب");badge("bDb",false,"—");badge("bAi",false,"—");return false;}
}
$("save").onclick=async()=>{store.set("fbase",baseUrl());store.set("ftoken",$("token").value.trim());
  if(!await health()){show("sMsg","err","الخادم لا يستجيب. انتظر دقيقة وأعد المحاولة.");return;}
  try{await api("/api/projects");show("sMsg","ok","تم الاتصال وصحّ الرمز.");loadProjects();}catch(e){show("sMsg","err",e.message);}};
function scriptHtml(p){const s=p.script_json||{};return '<div class="proj"><b>'+esc(s.title||p.lesson_name)+'</b><small>'+esc(p.unit_name)+' · '+esc(p.lesson_name)+' · '+esc(p.voice)+'</small>'
 +(s.summary?'<div class="scene">'+esc(s.summary)+'</div>':"")
 +(s.scenes||[]).map(x=>'<div class="scene"><i>مشهد '+esc(x.scene)+' ('+esc(x.seconds)+'ث)</i><br>🎬 '+esc(x.visual)+'<br>🎙 '+esc(x.narration)+(x.music?'<br>🎵 '+esc(x.music):"")+'</div>').join("")
 +(s.coverage_notes&&s.coverage_notes.length?'<div class="scene">ملاحظات: '+esc(s.coverage_notes.join(" • "))+'</div>':"")
 +'<button class="btn2" data-copy="'+esc(p.id)+'">نسخ السيناريو</button> <button class="btn2" data-del="'+esc(p.id)+'">حذف</button></div>';}
let cache=[];
async function loadProjects(){
  try{const d=await api("/api/projects");cache=d.projects;$("pMsg").className="msg";
    $("projects").innerHTML=cache.length?cache.map(scriptHtml).join(""):'<div class="msg ok" style="display:block">لا توجد مشاريع محفوظة بعد.</div>';}
  catch(e){show("pMsg","err","تعذرت المزامنة: "+e.message);}
}
$("sync").onclick=loadProjects;
$("projects").onclick=async e=>{const c=e.target.dataset.copy,d=e.target.dataset.del;
  if(c){const p=cache.find(x=>x.id===c);const s=p.script_json||{};const t=(s.title||p.lesson_name)+"\n\n"+(s.scenes||[]).map(x=>"مشهد "+x.scene+"\nالمشهد: "+x.visual+"\nالتعليق: "+x.narration).join("\n\n");
    try{await navigator.clipboard.writeText(t);show("pMsg","ok","تم نسخ السيناريو.");}catch{show("pMsg","err","تعذر النسخ.");}}
  if(d&&confirm("حذف هذا المشروع؟")){try{await api("/api/projects/"+d,{method:"DELETE"});loadProjects();}catch(x){show("pMsg","err",x.message);}}};
$("pdf").onchange=e=>{const f=e.target.files[0];$("fileInfo").textContent=f?("الملف المحدد: "+f.name+" — "+(f.size/1048576).toFixed(2)+" MB"):"لم يتم اختيار ملف.";};
async function extract(f){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";
  for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n";if(t.length>600000)break;}return t;}
$("analyze").onclick=async()=>{
  const f=$("pdf").files[0],lesson=$("lesson").value.trim();
  if(!f)return show("aMsg","err","اختر ملف الكتاب PDF أولاً.");if(!lesson)return show("aMsg","err","اكتب اسم الدرس.");
  if(!$("token").value.trim())return show("aMsg","err","أدخل رمز الوصول من صفحة الإعدادات.");
  $("analyze").disabled=true;show("aMsg","ok","جارٍ قراءة الكتاب...");
  try{let text=await extract(f);
    const i=text.indexOf(lesson);if(i>-1&&text.length>110000)text=text.slice(Math.max(0,i-5000),i+105000);
    show("aMsg","ok","جارٍ إعداد السيناريو بواسطة Gemini (قد يستغرق نحو دقيقة)...");
    const d=await api("/api/analyze",{method:"POST",body:JSON.stringify({grade:$("grade").value,unit:$("unit").value,lesson,duration:$("duration").value,voice:$("voice").value,style:$("style").value,aspect:$("aspect").value,language:$("language").value,speed:$("speed").value,music:$("music").value,characters:$("characters").value,extracted_text:text})});
    show("aMsg","ok","تم إعداد السيناريو وحُفظ.");$("result").innerHTML='<div class="card">'+scriptHtml(d.project)+'</div>';cache.unshift(d.project);
  }catch(e){show("aMsg","err","خطأ أثناء التحليل: "+e.message);}finally{$("analyze").disabled=false;}};
$("portrait").onchange=e=>{const f=e.target.files[0];if(f){$("pv").src=URL.createObjectURL(f);$("pv").style.display="block";}};
health();if($("token").value)loadProjects();
</script></body></html>
