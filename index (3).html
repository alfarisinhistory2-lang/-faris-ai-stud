<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f"><title>FARIS AI STUDIO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--o:#ff6a2b;--o2:#ff9a5c;--bg:#0b0b0f;--card:#14141b;--line:#3a2a22;--mut:#b9b0a8}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 20% -10%,#3a1608 0,transparent 45%),var(--bg);color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.frame{border:2px solid var(--o);border-radius:8px;box-shadow:0 0 10px var(--o),0 0 38px #ff6a2b55,inset 0 0 22px #ff6a2b22;background:var(--card);position:relative;overflow:hidden}
.gate{max-width:440px;margin:26px auto;width:calc(100% - 28px)}
.hero{padding:34px 22px 64px;background:linear-gradient(158deg,#ff7a3a 0,#9a3a0f 46%,transparent 46.2%);text-align:right}
.logo{width:54px;height:54px;border-radius:16px;background:#0b0b0f;color:var(--o);display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 0 18px #0008}
.hero h1{margin:14px 0 4px;font-size:21px;letter-spacing:.5px}.hero p{margin:0;font-size:12px;color:#ffe6d6}
.gbody{padding:4px 22px 24px}.tabs2{display:flex;gap:8px;margin-bottom:6px}
.tabs2 button,nav button{flex:1;padding:11px;border-radius:30px;border:1px solid var(--line);background:#0f0f15;color:var(--mut);font-size:13px}
.tabs2 button.on,nav button.on{color:#fff;border-color:var(--o);box-shadow:0 0 12px #ff6a2b66;background:#2a140a}
label{display:block;font-size:13px;margin:15px 0 7px;color:#f1e4da}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #4a3326;background:#0b0b10;color:#fff;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--o);box-shadow:0 0 12px #ff6a2b66}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:30px;background:linear-gradient(120deg,#ff8a4a,#e04a10);color:#fff;font-weight:bold;font-size:15px;box-shadow:0 0 18px #ff6a2b77}
.btn:disabled{opacity:.5}.btn2{padding:10px 16px;border-radius:30px;border:1px solid var(--o);background:#0f0f15;color:var(--o2);font-size:13px;margin:4px 0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--o);box-shadow:0 4px 22px #ff6a2b44;background:#0d0d12}
header b{font-size:15px}header button{background:none;border:0;color:var(--o);font-size:22px}
nav{display:flex;gap:8px;padding:14px 16px 4px}.page{display:none;padding:12px 16px 44px}.page.on{display:block}
.card{margin-bottom:18px;padding:18px}.card h2{font-size:16px;margin:0 0 6px;color:var(--o2)}
.msg{margin-top:14px;padding:13px;border-radius:12px;font-size:13px;line-height:1.9;display:none}.msg.err{display:block;background:#3d1218;border:1px solid #b04050;color:#ffc0c8}.msg.ok{display:block;background:#10301f;border:1px solid #3a8a58;color:#b8f0cc}
.file{margin-top:8px;padding:11px;border:1px dashed #a0643a;border-radius:12px;font-size:12px;color:#ffd2b0;background:#1d130e}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px}
.badge{padding:5px 14px;border-radius:20px;font-size:12px;border:1px solid #3a8a58;background:#10301f;color:#a8e8bf}.badge.bad{border-color:#b04050;background:#3d1218;color:#ffb0ba}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proj{border-top:1px solid var(--line);padding:14px 0}.proj small{color:var(--mut);display:block;margin:4px 0 8px}
.scene{background:#0b0b10;border:1px solid #2c2018;border-radius:10px;padding:10px;margin:8px 0;font-size:12px;line-height:1.9}.scene i{color:var(--o2);font-style:normal}

html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
input,select,button{min-height:48px;font-size:16px}
.gate{max-width:none;width:100%;margin:0;min-height:100dvh;border-radius:0;border:0;box-shadow:inset 0 0 44px #ff6a2b33}
.hero{padding:calc(40px + env(safe-area-inset-top)) 24px 72px}
.gbody{padding:0 20px calc(26px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;min-height:56px}
header button{min-width:46px;font-size:24px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;background:#0d0d12f2;backdrop-filter:blur(10px);border-top:2px solid var(--o);box-shadow:0 -4px 22px #ff6a2b44}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:14px;background:transparent;font-size:11px;padding:6px;min-height:54px;box-shadow:none}
nav button .ic{font-size:21px;line-height:1}
nav button.on{background:#2a140a;color:var(--o2);box-shadow:none}
.page{padding:12px 12px 20px}
.card.frame{border-width:1px;border-radius:18px;box-shadow:0 0 18px #ff6a2b33,inset 0 0 14px #ff6a2b14;padding:16px}
.btn{min-height:54px}.two{gap:10px}.btn2{min-height:46px}
@media(min-width:700px){#app,.gate{max-width:480px;margin-left:auto;margin-right:auto}nav{max-width:480px;left:50%;right:auto;transform:translateX(-50%);width:100%}.gate{min-height:100vh}}
</style></head><body>

<div id="gate" class="frame gate">
 <div class="hero"><div class="logo">ف</div><h1>FARIS AI STUDIO</h1><p>من الكتاب المدرسي إلى الحصة المصوّرة</p></div>
 <div class="gbody">
  <div class="tabs2"><button class="on" data-g="g1">دخول</button><button data-g="g2">الخادم</button></div>
  <div id="g1"><label>رمز الوصول</label><input id="token" type="password" autocomplete="off" dir="ltr" placeholder="••••••••"><button class="btn" id="enter">دخول إلى الاستوديو</button></div>
  <div id="g2" hidden><label>رابط الخادم</label><input id="base" dir="ltr" value="https://faris-ai-stud.onrender.com"><button class="btn" id="saveBase">حفظ الرابط</button></div>
  <div class="msg" id="gMsg"></div>
 </div>
</div>

<div id="app" hidden>
<header><button id="logout" title="خروج">⏻</button><b>FARIS AI STUDIO</b><button id="share">⤴</button></header>
<nav><button class="on" data-p="create"><span class="ic">✦</span>إنشاء</button><button data-p="settings"><span class="ic">▤</span>المشاريع والحالة</button></nav>

<section class="page on" id="create"><div class="card frame"><h2>تحليل درس وإعداد السيناريو</h2>
<label>الصف</label><input id="grade" placeholder="مثال: الصف الثالث الثانوي">
<label>الكتاب: ملف PDF</label><input type="file" id="pdf" accept="application/pdf,.pdf">
<label>أو صفحات مصوّرة (حتى 6 صور)</label>
<div class="two"><button class="btn2" id="camBtn">📷 تصوير صفحة</button><button class="btn2" id="galBtn">🖼 من المعرض</button></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="gal" accept="image/*" multiple hidden>
<div class="file" id="fileInfo">لم يتم اختيار مصدر.</div>
<label>الوحدة</label><input id="unit"><label>الدرس</label><input id="lesson">
<div class="two"><div><label>مدة الفيديو</label><select id="duration"><option value="short">دقيقة</option><option value="medium">3 دقائق</option><option value="long">5 دقائق</option></select></div>
<div><label>نسبة الشاشة</label><select id="aspect"><option value="9:16">عمودي</option><option value="16:9">أفقي</option></select></div></div>
<label>أسلوب الفيديو</label><select id="style"><option value="cartoon">كرتوني تعليمي</option><option value="documentary">وثائقي سينمائي</option><option value="story">قصة تعليمية</option><option value="investigation">تحقيق وتشويق</option><option value="visual">شرح بصري</option><option value="classroom">حصة صفية</option></select>
<div class="two"><div><label>لغة التعليق</label><select id="language"><option value="fusha">فصحى مبسطة</option><option value="sudani">سودانية</option><option value="english">English</option></select></div>
<div><label>السرعة</label><select id="speed"><option value="slow">بطيئة</option><option value="normal" selected>عادية</option><option value="fast">سريعة</option></select></div></div>
<div class="two"><div><label>الموسيقى</label><select id="music"><option value="calm">هادئة</option><option value="epic">ملحمية</option><option value="playful">مرحة</option><option value="none">بدون</option></select></div>
<div><label>صوت التعليق</label><select id="voice"><option>الأستاذ فارس</option><option>معلّقة نسائية</option><option>راوٍ وثائقي</option></select></div></div>
<label>الشخصيات</label><input id="characters" placeholder="مثال: الأستاذ فارس، رودينا، مكة">
<label>صورة الأستاذ فارس (معاينة)</label><input type="file" id="portrait" accept="image/*"><img id="pv" hidden style="width:84px;height:84px;object-fit:cover;border-radius:14px;margin-top:10px;border:1px solid var(--o)">
<button class="btn" id="analyze">تحليل الدرس وإعداد السيناريو</button><div class="msg" id="aMsg"></div></div>
<div id="result"></div></section>

<section class="page" id="settings">
<div class="card frame"><h2>حالة الاتصال السحابي</h2>
<div class="row"><span>الخادم</span><span class="badge bad" id="bSrv">—</span></div>
<div class="row"><span>قاعدة Neon</span><span class="badge bad" id="bDb">—</span></div>
<div class="row"><span>محرك Gemini</span><span class="badge bad" id="bAi">—</span></div></div>
<div class="card frame"><h2>المشاريع المحفوظة</h2><button class="btn2" id="sync">مزامنة من الخادم</button><div class="msg" id="pMsg"></div><div id="projects"></div></div>
</section></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
$("base").value=store.get("fbase")||$("base").value;
const baseUrl=()=>$("base").value.trim().replace(/\/$/,"");
let token=store.get("ftoken"),imgs=[],cache=[];
function show(id,type,t){const e=$(id);e.className="msg "+type;e.textContent=t;}
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x===b));$("g1").hidden=b.dataset.g!=="g1";$("g2").hidden=b.dataset.g!=="g2";});
function tab(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===p));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.p));
$("share").onclick=()=>{if(navigator.share)navigator.share({title:"FARIS AI STUDIO",url:location.href}).catch(()=>{})};
async function api(path,o={}){let r;try{r=await fetch(baseUrl()+path,{...o,headers:{Authorization:"Bearer "+token,...(o.body?{"Content-Type":"application/json"}:{})}});}
 catch{throw Error("تعذر الوصول إلى الخادم. تحقق من الرابط (قد يحتاج الخادم دقيقة ليستيقظ).");}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||("خطأ "+r.status));return d;}
function badge(id,ok,t){const e=$(id);e.textContent=t;e.className="badge"+(ok?"":" bad");}
async function health(){try{const d=await(await fetch(baseUrl()+"/health")).json();badge("bSrv",true,"يعمل");badge("bDb",d.database==="connected",d.database==="connected"?"متصل":"غير متصل");badge("bAi",!!d.geminiConfigured,d.geminiConfigured?"مفعّل":"غير مفعّل");return true;}
 catch{badge("bSrv",false,"لا يستجيب");badge("bDb",false,"—");badge("bAi",false,"—");return false;}}
async function enter(silent){token=$("token").value.trim()||token;
 if(!token){if(!silent)show("gMsg","err","أدخل رمز الوصول.");return;}
 if(!silent)show("gMsg","ok","جارٍ التحقق...");
 if(!await health()){if(!silent)show("gMsg","err","الخادم لا يستجيب. انتظر دقيقة وأعد المحاولة.");return;}
 try{await api("/api/projects");store.set("ftoken",token);$("gate").hidden=true;$("app").hidden=false;loadProjects();}
 catch(e){if(!silent)show("gMsg","err",e.message==="UNAUTHORIZED"||/رمز/.test(e.message)?"رمز الوصول غير صحيح.":e.message);}}
$("enter").onclick=()=>enter(false);
$("saveBase").onclick=()=>{store.set("fbase",baseUrl());show("gMsg","ok","تم حفظ رابط الخادم.");};
$("logout").onclick=()=>{token="";store.set("ftoken","");$("token").value="";$("app").hidden=true;$("gate").hidden=false;show("gMsg","ok","تم تسجيل الخروج.");};
function scriptHtml(p){const s=p.script_json||{};return '<div class="proj"><b>'+esc(s.title||p.lesson_name)+'</b><small>'+esc(p.unit_name)+' · '+esc(p.lesson_name)+' · '+esc(p.voice)+'</small>'
 +(s.summary?'<div class="scene">'+esc(s.summary)+'</div>':"")
 +(s.scenes||[]).map(x=>'<div class="scene"><i>مشهد '+esc(x.scene)+' ('+esc(x.seconds)+'ث)</i><br>🎬 '+esc(x.visual)+'<br>🎙 '+esc(x.narration)+(x.music?'<br>🎵 '+esc(x.music):"")+'</div>').join("")
 +(s.coverage_notes&&s.coverage_notes.length?'<div class="scene">ملاحظات: '+esc(s.coverage_notes.join(" • "))+'</div>':"")
 +'<button class="btn2" data-copy="'+esc(p.id)+'">نسخ</button> <button class="btn2" data-dl="'+esc(p.id)+'">تنزيل txt</button> <button class="btn2" data-del="'+esc(p.id)+'">حذف</button></div>';}
function asText(p){const s=p.script_json||{};return (s.title||p.lesson_name)+"\n\n"+(s.scenes||[]).map(x=>"مشهد "+x.scene+" ("+x.seconds+"ث)\nالمشهد: "+x.visual+"\nالتعليق: "+x.narration+(x.music?"\nالموسيقى: "+x.music:"")).join("\n\n");}
async function loadProjects(){try{const d=await api("/api/projects");cache=d.projects;$("pMsg").className="msg";$("projects").innerHTML=cache.length?cache.map(scriptHtml).join(""):'<div class="msg ok" style="display:block">لا توجد مشاريع محفوظة بعد.</div>';}catch(e){show("pMsg","err","تعذرت المزامنة: "+e.message);}}
$("sync").onclick=loadProjects;
async function onAct(e){const t=e.target,c=t.dataset.copy,d=t.dataset.del,dl=t.dataset.dl;
 if(c){try{await navigator.clipboard.writeText(asText(cache.find(x=>x.id===c)));alert("تم النسخ");}catch{alert("تعذر النسخ");}}
 if(dl){const p=cache.find(x=>x.id===dl),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([asText(p)],{type:"text/plain;charset=utf-8"}));a.download=(p.lesson_name||"script")+".txt";a.click();}
 if(d&&confirm("حذف هذا المشروع؟")){try{await api("/api/projects/"+d,{method:"DELETE"});loadProjects();}catch(x){alert(x.message);}}}
$("projects").onclick=onAct;$("result").onclick=onAct;
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7).split(",")[1]);URL.revokeObjectURL(im.src);};im.onerror=()=>r(null);im.src=URL.createObjectURL(f);});}
function info(){const f=$("pdf").files[0];$("fileInfo").textContent=(f?"PDF: "+f.name+" — "+(f.size/1048576).toFixed(2)+" MB":"")+(f&&imgs.length?" + ":"")+(imgs.length?imgs.length+" صفحة مصوّرة":"")||"لم يتم اختيار مصدر.";}
$("pdf").onchange=info;$("camBtn").onclick=()=>$("cam").click();$("galBtn").onclick=()=>$("gal").click();
async function addImgs(e){for(const f of e.target.files){if(imgs.length>=6)break;const b=await shrink(f);if(b)imgs.push(b);}e.target.value="";info();}
$("cam").onchange=addImgs;$("gal").onchange=addImgs;
$("portrait").onchange=e=>{const f=e.target.files[0];if(f){$("pv").src=URL.createObjectURL(f);$("pv").hidden=false;}};
async function extract(f){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t="";for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n";if(t.length>600000)break;}return t;}
$("analyze").onclick=async()=>{const f=$("pdf").files[0],lesson=$("lesson").value.trim();
 if(!f&&!imgs.length)return show("aMsg","err","اختر ملف PDF أو صوّر صفحات الدرس.");if(!lesson)return show("aMsg","err","اكتب اسم الدرس.");
 $("analyze").disabled=true;show("aMsg","ok","جارٍ قراءة المصدر...");
 try{let text="";if(f){text=await extract(f);const i=text.indexOf(lesson);if(i>-1&&text.length>110000)text=text.slice(Math.max(0,i-5000),i+105000);}
  show("aMsg","ok","جارٍ إعداد السيناريو بواسطة Gemini (قد يستغرق نحو دقيقة)...");
  const d=await api("/api/analyze",{method:"POST",body:JSON.stringify({grade:$("grade").value,unit:$("unit").value,lesson,duration:$("duration").value,voice:$("voice").value,style:$("style").value,aspect:$("aspect").value,language:$("language").value,speed:$("speed").value,music:$("music").value,characters:$("characters").value,extracted_text:text,images:imgs})});
  show("aMsg","ok","تم إعداد السيناريو وحُفظ.");$("result").innerHTML='<div class="card frame">'+scriptHtml(d.project)+'</div>';cache.unshift(d.project);
 }catch(e){show("aMsg","err","خطأ أثناء التحليل: "+e.message);}finally{$("analyze").disabled=false;}};
if(token)enter(true);
</script></body></html>
